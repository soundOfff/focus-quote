<svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="FocusQuote">
  <!--
    FocusQuote mark — Direction A (Editorial).
    A warm amber "paper tile" with a serif opening quotation cut in cream,
    anchored by a focus underline. Source of truth for the 32/48/128 icons.
    The tile, gradient, and rim are baked in so the PNG stands alone.
  -->
  <defs>
    <radialGradient id="fq-field" cx="0.3" cy="0.18" r="1.05">
      <stop offset="0" stop-color="#F7B45C"/>
      <stop offset="0.46" stop-color="#F2A03C"/>
      <stop offset="1" stop-color="#E08E2A"/>
    </radialGradient>
  </defs>

  <!-- amber field -->
  <rect width="88" height="88" rx="21.12" ry="21.12" fill="url(#fq-field)"/>

  <!-- serif opening quotation, cream -->
  <g fill="#FBFAF6">
    <path d="M30 24 c-7.2 0-13 5.4-13 12.4 0 6.4 4.8 11.2 11 11.2 1.2 0 2.4-.2 3.3-.5 -.9 4.6-4.6 8.2-9.4 9.7-1.3.4-2 .9-2 2 0 1.3 1 2.2 2.5 2 C32 61.6 39 53.4 39 41.3 39 31.2 35.6 24 30 24Z"/>
    <path d="M61 24 c-7.2 0-13 5.4-13 12.4 0 6.4 4.8 11.2 11 11.2 1.2 0 2.4-.2 3.3-.5 -.9 4.6-4.6 8.2-9.4 9.7-1.3.4-2 .9-2 2 0 1.3 1 2.2 2.5 2 C63 61.6 70 53.4 70 41.3 70 31.2 66.6 24 61 24Z"/>
  </g>

  <!-- focus underline -->
  <rect x="30" y="66" width="28" height="3.4" rx="1.7" fill="#FBFAF6" opacity="0.92"/>

  <!-- hairline rim -->
  <rect x="0.5" y="0.5" width="87" height="87" rx="20.62" ry="20.62" fill="none" stroke="#784810" stroke-opacity="0.45" stroke-width="0.9"/>
</svg>
