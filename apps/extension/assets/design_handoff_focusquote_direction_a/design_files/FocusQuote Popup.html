<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FocusQuote — Popup Redesign</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  html, body { background: #E9E7E1; margin: 0; }
  body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #1A1814; }

  /* ───────── shared popup tokens ───────── */
  .pop {
    --paper:        #FBFAF6;
    --paper-2:      #F4F2EC;
    --ink:          #1A1814;
    --ink-2:        #3A362F;
    --muted:        #807A6F;
    --muted-2:      #B5AEA0;
    --rule:         #E5E0D5;
    --rule-2:       #D9D3C5;
    --amber:        #F2A03C;
    --amber-deep:   #C77A1F;
    --amber-soft:   #FBE6C8;
    --blue-soft:    #E0EBF1;
    --blue-ink:     #2E5C73;
    --sage-soft:    #E1EBDF;
    --sage-ink:     #4A6A47;
    --clay-soft:    #F2DDD3;
    --clay-ink:     #A04B26;

    font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    width: 380px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 12px 28px -12px rgba(40,30,15,0.18),
      0 2px 6px -2px rgba(40,30,15,0.10);
    border: 1px solid #DAD3C2;
  }

  .pop * { box-sizing: border-box; }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .serif { font-family: 'Newsreader', 'Iowan Old Style', Georgia, serif; }

  /* generic */
  .btn-amber {
    background: linear-gradient(180deg, #F4AC4F 0%, #EE9B30 100%);
    color: #2A1A05;
    border: 1px solid #C77A1F;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 1px 2px rgba(40,30,15,0.15);
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-amber:hover { filter: brightness(1.03); }
  .btn-ghost {
    background: var(--paper);
    border: 1px solid var(--rule-2);
    color: var(--ink-2);
    border-radius: 8px;
    font-weight: 500;
    font-size: 12px;
    padding: 8px 10px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { background: var(--paper-2); }

  .input {
    width: 100%;
    background: var(--paper-2);
    border: 1px solid var(--rule-2);
    border-radius: 8px;
    padding: 9px 11px;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }
  .input::placeholder { color: var(--muted-2); }
  .input:focus { border-color: var(--amber-deep); box-shadow: 0 0 0 3px rgba(242,160,60,0.15); }

  /* tag chip */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); background: var(--paper-2); border: 1px solid var(--rule);
    padding: 3px 7px 3px 7px; border-radius: 999px;
  }

  /* divider */
  .rule { height: 1px; background: var(--rule); width: 100%; }
  .rule-dashed { height: 1px; background-image: linear-gradient(to right, var(--rule-2) 50%, transparent 0%); background-size: 6px 1px; background-repeat: repeat-x; }

  /* scrollbar lite */
  .scroll::-webkit-scrollbar { width: 4px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 2px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="variant-a.jsx"></script>
<script type="text/babel" src="variant-b.jsx"></script>
<script type="text/babel" src="variant-c.jsx"></script>
<script type="text/babel" src="variant-a-selection.jsx"></script>
<script type="text/babel" src="canvas-app.jsx"></script>
</body>
</html>
